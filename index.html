<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Make Your Portfolio!</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    @import url('./figma-export/variables.css');

    :root {
      --color-bg: var(--figma-color-bg, #f6f6fb);
      --color-surface: var(--figma-color-surface, #ffffff);
      --color-border: var(--figma-color-border, #e2e3eb);
      --color-border-strong: var(--figma-color-border-strong, #7a70ff);
      --color-text: var(--figma-color-text, #1d2a3b);
      --color-muted: var(--figma-color-muted, #748097);
      --color-input: var(--figma-color-input, #f0f1f5);
      --color-cta: var(--figma-color-cta, #9f95ff);
      --color-cta-text: var(--figma-color-cta-text, #ffffff);
      --color-error: var(--figma-color-error, #c53b3b);
      --radius-xs: var(--figma-radius-xs, 8px);
      --radius-sm: var(--figma-radius-sm, 10px);
      --radius-md: var(--figma-radius-md, 12px);
      --radius-lg: var(--figma-radius-lg, 14px);
      --space-1: var(--figma-space-1, 8px);
      --space-2: var(--figma-space-2, 12px);
      --space-3: var(--figma-space-3, 16px);
      --space-4: var(--figma-space-4, 20px);
      --space-5: var(--figma-space-5, 24px);
      --space-6: var(--figma-space-6, 32px);
      --font-family: var(--figma-font-family, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif);
      --font-size-title: var(--figma-font-size-title, 44px);
      --font-size-subtitle: var(--figma-font-size-subtitle, 20px);
      --font-size-heading: var(--figma-font-size-heading, 32px);
      --font-size-body: var(--figma-font-size-body, 16px);
      --font-size-label: var(--figma-font-size-label, 22px);
      --font-size-small: var(--figma-font-size-small, 15px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: var(--font-family);
      color: var(--color-text);
      background: var(--color-bg);
    }

    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-surface);
    }

    .header {
      padding: var(--space-5) var(--space-6);
      border-bottom: 1px solid var(--color-border);
    }

    .title {
      margin: 0;
      font-size: clamp(30px, 3.2vw, var(--font-size-title));
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--color-muted);
      font-size: var(--font-size-subtitle);
      line-height: 1.3;
      font-weight: 500;
    }

    .content {
      min-height: 0;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(520px, 1fr) minmax(480px, 1fr);
    }

    .panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .panel + .panel {
      border-left: 1px solid var(--color-border);
    }

    .panel-heading {
      margin: 0;
      padding: var(--space-4) var(--space-6);
      border-bottom: 1px solid var(--color-border);
      font-size: clamp(24px, 2.2vw, var(--font-size-heading));
      font-weight: 700;
      line-height: 1.2;
    }

    .form-wrap {
      min-height: 0;
      overflow: auto;
      padding: var(--space-5) var(--space-6) 120px;
    }

    .question-block {
      margin-bottom: 28px;
    }

    .question-label {
      display: block;
      margin-bottom: 10px;
      font-size: clamp(16px, 1.5vw, var(--font-size-label));
      font-weight: 700;
      line-height: 1.2;
    }

    .question-textarea {
      width: 100%;
      min-height: 64px;
      resize: vertical;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: var(--color-input);
      padding: 16px 18px;
      font: inherit;
      font-size: clamp(14px, 1.4vw, var(--font-size-body));
      color: var(--color-text);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .question-textarea::placeholder {
      color: #939cab;
    }

    .question-textarea:focus {
      border-color: var(--color-border-strong);
    }

    .question-textarea.error {
      border-color: var(--color-error);
    }

    .field-error {
      margin-top: 8px;
      color: var(--color-error);
      font-size: 14px;
      font-weight: 500;
      min-height: 18px;
    }

    .templates-wrap {
      min-height: 0;
      overflow: auto;
      padding: var(--space-4) var(--space-5) 106px;
    }

    .template-card {
      width: 100%;
      margin: 0 0 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fff;
      padding: 12px;
      display: grid;
      grid-template-columns: 50px 1fr auto;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .template-card:hover {
      border-color: #bcb6ff;
    }

    .template-card.selected {
      border: 2px solid var(--color-border-strong);
      background: #f5f5ff;
      padding: 11px;
    }

    .template-thumb {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      background: #d8dbe6;
      border: 1px solid var(--color-border);
    }

    .template-name {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .view-btn {
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: #fff;
      color: var(--color-text);
      padding: 10px 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .view-btn:hover {
      border-color: #c9ceda;
    }

    .template-error {
      margin-top: 6px;
      margin-left: 64px;
      font-size: 13px;
      color: var(--color-error);
      font-weight: 500;
    }

    .panel-footer {
      margin-top: auto;
      border-top: 1px solid var(--color-border);
      padding: 24px var(--space-5);
      background: var(--color-surface);
      position: sticky;
      bottom: 0;
    }

    .cta-btn {
      width: 100%;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--color-cta);
      color: var(--color-cta-text);
      font: inherit;
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      padding: 22px 18px;
      cursor: pointer;
      box-shadow: inset 0 -2px rgba(0, 0, 0, 0.08);
    }

    .cta-error {
      margin-top: 12px;
      min-height: 20px;
      color: var(--color-error);
      font-size: 14px;
      font-weight: 500;
    }

    .selection-error {
      margin-top: 8px;
      color: var(--color-error);
      font-size: 14px;
      font-weight: 500;
      min-height: 18px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.66);
      padding: 24px;
    }

    .modal.open {
      display: flex;
    }

    .modal-dialog {
      width: min(1400px, 100%);
      height: min(900px, 100%);
      border-radius: 14px;
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--color-border);
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border);
      background: #f8f9fd;
    }

    .modal-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .modal-close {
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 8px 12px;
      background: #fff;
      font: inherit;
      cursor: pointer;
      font-weight: 600;
    }

    .modal-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 1120px) {
      .content {
        grid-template-columns: 1fr;
      }

      .panel + .panel {
        border-left: 0;
        border-top: 1px solid var(--color-border);
      }

      .panel-footer {
        position: static;
      }

      .form-wrap,
      .templates-wrap {
        padding-bottom: var(--space-5);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">Make Your Portfolio!</h1>
      <p class="subtitle">Create your own portfolio website in minutes</p>
    </header>

    <main class="content">
      <section class="panel" aria-label="Fill in information about you">
        <h2 class="panel-heading">Fill in information about you</h2>
        <div class="form-wrap">
          <form id="portfolioForm" novalidate></form>
        </div>
      </section>

      <section class="panel" aria-label="Choose the website format">
        <h2 class="panel-heading">Choose the website format</h2>
        <div class="templates-wrap">
          <div id="templatesList"></div>
          <div id="templateSelectionError" class="selection-error" aria-live="polite"></div>
        </div>
        <div class="panel-footer">
          <button id="makePromptBtn" class="cta-btn" type="button">↳&nbsp; Make your Prompt!</button>
          <div id="ctaError" class="cta-error" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="templateModal" class="modal" role="dialog" aria-modal="true" aria-label="Template preview">
    <div class="modal-dialog">
      <div class="modal-top">
        <p id="modalTitle" class="modal-title">Template Preview</p>
        <button id="closeModalBtn" class="modal-close" type="button">Close</button>
      </div>
      <iframe id="previewIframe" class="modal-iframe" title="Template preview"></iframe>
    </div>
  </div>

  <script>
    // Editable list of questions rendered in the left panel form.
    const QUESTIONS = [
      { id: 'q1', label: 'What is your name?', placeholder: 'e.g., Alex Johnson' },
      { id: 'q2', label: 'What school and grade are you in?', placeholder: 'e.g., Lincoln High, 11th Grade' },
      { id: 'q3', label: 'What are your core interests or hobbies?', placeholder: 'e.g., Coding, Photography, Music' },
      { id: 'q4', label: 'Describe a project you are proud of.', placeholder: 'e.g., Built a weather app used by classmates' },
      { id: 'q5', label: 'What technical or creative skills do you have?', placeholder: 'e.g., JavaScript, Python, Design' },
      { id: 'q6', label: 'What are your academic or career goals?', placeholder: 'e.g., Study Computer Science, start a startup' },
      { id: 'q7', label: 'How would you describe your personal style or tone? (e.g. professional, fun, minimal)', placeholder: 'e.g., Professional but approachable' },
      { id: 'q8', label: 'Share a fun fact about yourself.', placeholder: 'e.g., I can solve a Rubik\'s cube in under a minute' }
    ];

    const formElement = document.getElementById('portfolioForm');
    const templatesListElement = document.getElementById('templatesList');
    const templateSelectionErrorElement = document.getElementById('templateSelectionError');
    const ctaErrorElement = document.getElementById('ctaError');
    const makePromptButton = document.getElementById('makePromptBtn');
    const modalElement = document.getElementById('templateModal');
    const modalTitleElement = document.getElementById('modalTitle');
    const previewIframeElement = document.getElementById('previewIframe');
    const closeModalButton = document.getElementById('closeModalBtn');

    let templateEntries = [];
    let selectedTemplatePath = '';
    const TEMPLATE_ROOT_CANDIDATES = ['./templates', './Templates'];
    const TEMPLATE_ENTRY_CANDIDATES = ['index.html', 'sphere.html', 'styles.html'];

    // Render all question fields from the QUESTIONS array.
    function renderQuestions() {
      formElement.innerHTML = QUESTIONS.map((question, index) => {
        const questionNumber = index + 1;
        return `
          <div class="question-block" data-question-id="${question.id}">
            <label class="question-label" for="${question.id}">Q${questionNumber}: ${question.label}</label>
            <textarea id="${question.id}" name="${question.id}" class="question-textarea" required placeholder="${question.placeholder || ''}"></textarea>
            <div id="${question.id}-error" class="field-error" aria-live="polite"></div>
          </div>
        `;
      }).join('');
    }

    // Normalize any relative template path into a clean URL-friendly relative path.
    function normalizeRelativePath(path) {
      return String(path || '')
        .trim()
        .replace(/\\/g, '/')
        .replace(/^\.\//, '')
        .replace(/^\/+/, '')
        .replace(/\/+$/, '');
    }

    // Build the expected preview image basename from template path and root folder.
    function inferPreviewBasename(relativePath) {
      const normalized = normalizeRelativePath(relativePath);
      return normalized
        .replace(/\/index\.html$/i, '')
        .replace(/\.html$/i, '')
        .split('/')
        .filter(Boolean)
        .pop() || 'template';
    }

    // Check whether a URL exists, trying HEAD first and then GET as fallback.
    async function urlExists(url) {
      try {
        const headResponse = await fetch(url, { method: 'HEAD' });
        if (headResponse.ok) {
          return true;
        }
      } catch (error) {
        // Ignore and try GET fallback.
      }

      try {
        const getResponse = await fetch(url);
        return getResponse.ok;
      } catch (error) {
        return false;
      }
    }

    // Resolve a usable preview image with fallback candidates inside template folders.
    async function resolvePreviewPath(root, relativePath) {
      const normalized = normalizeRelativePath(relativePath);
      const basename = inferPreviewBasename(normalized);
      const previewCandidates = [
        `${root}/previews/${basename}.png`,
        `${root}/previews/${basename}.jpg`,
        `${root}/previews/${basename}.jpeg`,
        `${root}/previews/${basename}.webp`
      ];

      for (const previewPath of previewCandidates) {
        if (await urlExists(previewPath)) {
          return previewPath;
        }
      }

      const templateFolder = normalized.replace(/\/index\.html$/i, '').replace(/\.html$/i, '');
      const folderSafe = templateFolder || 'template';
      const candidates = [
        `${root}/${folderSafe}/preview.png`,
        `${root}/${folderSafe}/preview.jpg`,
        `${root}/${folderSafe}/preview.jpeg`,
        `${root}/${folderSafe}/screenshot.png`,
        `${root}/${folderSafe}/screenshot.jpg`,
        `${root}/${folderSafe}/screenshot.jpeg`,
        `${root}/${folderSafe}/images/preview.png`,
        `${root}/${folderSafe}/images/preview.jpg`,
        `${root}/${folderSafe}/images/screenshot.png`,
        `${root}/${folderSafe}/images/screenshot.jpg`,
        `${root}/${folderSafe}/images/pic01.jpg`,
        `${root}/${folderSafe}/images/pic01.png`
      ];

      for (const candidate of candidates) {
        if (await urlExists(candidate)) {
          return candidate;
        }
      }

      return previewCandidates[0];
    }

    // Probe template files by common flat names like template1.html.
    async function probeFlatTemplateFiles(root) {
      const discovered = [];
      let missedInARow = 0;

      for (let index = 1; index <= 80; index += 1) {
        const filename = `template${index}.html`;
        const path = `${root}/${filename}`;

        try {
          const response = await fetch(path, { method: 'HEAD' });
          if (response.ok) {
            discovered.push({ root, relativePath: filename });
            missedInARow = 0;
          } else {
            missedInARow += 1;
          }
        } catch (error) {
          missedInARow += 1;
        }

        if (missedInARow >= 8 && discovered.length > 0) {
          break;
        }
      }

      return discovered;
    }

    // Probe for template-N pattern folders (e.g., template-1, template-2).
    async function probePatternedTemplateFolders(root) {
      const discovered = [];
      let missedInARow = 0;

      for (let index = 1; index <= 50; index += 1) {
        const folderName = `template-${index}`;
        let matchedEntry = '';

        for (const candidate of TEMPLATE_ENTRY_CANDIDATES) {
          const path = `${root}/${folderName}/${candidate}`;
          try {
            const response = await fetch(path, { method: 'HEAD' });
            if (response.ok) {
              matchedEntry = `${folderName}/${candidate}`;
              break;
            }
          } catch (error) {
            // Continue probing candidate entry files.
          }
        }

        if (matchedEntry) {
          discovered.push({ root, relativePath: matchedEntry });
          missedInARow = 0;
        } else {
          missedInARow += 1;
        }

        if (missedInARow >= 5 && discovered.length > 0) {
          break;
        }
      }

      return discovered;
    }

    // Try to parse web-server directory listing to discover folder-based templates.
    async function discoverFromDirectoryListing(root) {
      try {
        const response = await fetch(`${root}/`);
        if (!response.ok) {
          return [];
        }

        const listingHtml = await response.text();
        const hrefMatches = [...listingHtml.matchAll(/href=["']([^"']+)["']/gi)].map((match) => match[1]);
        const discovered = [];

        for (const href of hrefMatches) {
          const cleaned = normalizeRelativePath(href);
          const isDirectoryLink = String(href || '').trim().endsWith('/');
          if (!cleaned || cleaned === '..' || cleaned === '.') {
            continue;
          }

          if (/\.html$/i.test(cleaned)) {
            discovered.push({ root, relativePath: cleaned });
            continue;
          }

          if (isDirectoryLink) {
            const folderName = cleaned.replace(/\/+$/, '');
            if (folderName && folderName.toLowerCase() !== 'previews') {
              for (const candidate of TEMPLATE_ENTRY_CANDIDATES) {
                const candidatePath = `${root}/${folderName}/${candidate}`;
                if (await urlExists(candidatePath)) {
                  discovered.push({ root, relativePath: `${folderName}/${candidate}` });
                  break;
                }
              }
            }
          }
        }

        return discovered;
      } catch (error) {
        return [];
      }
    }

    // Recursively collect all files inside a template folder from server directory listings.
    async function collectFilesFromDirectory(directoryUrl, relativePrefix = '') {
      try {
        const response = await fetch(`${directoryUrl}/`);
        if (!response.ok) {
          return [];
        }

        const listingHtml = await response.text();
        const hrefMatches = [...listingHtml.matchAll(/href=["']([^"']+)["']/gi)].map((match) => match[1]);
        const files = [];

        for (const href of hrefMatches) {
          const raw = String(href || '').trim();
          if (!raw || raw === '../' || raw === './' || raw.startsWith('?') || raw.startsWith('#')) {
            continue;
          }

          const cleaned = normalizeRelativePath(raw);
          if (!cleaned || cleaned === '..' || cleaned === '.') {
            continue;
          }

          if (raw.endsWith('/')) {
            const nestedPath = cleaned.replace(/\/+$/, '');
            const nestedFiles = await collectFilesFromDirectory(
              `${directoryUrl}/${nestedPath}`,
              `${relativePrefix}${nestedPath}/`
            );
            files.push(...nestedFiles);
          } else {
            files.push(`${relativePrefix}${cleaned}`);
          }
        }

        return files;
      } catch (error) {
        return [];
      }
    }

    // Infer template list from manifest, directory listing, and filename probing.
    async function discoverTemplateFiles() {
      const discovered = [];

      for (const root of TEMPLATE_ROOT_CANDIDATES) {
        try {
          const manifestResponse = await fetch(`${root}/index.json`);
          if (manifestResponse.ok) {
            const manifest = await manifestResponse.json();
            if (Array.isArray(manifest) && manifest.length > 0) {
              manifest.forEach((item) => {
                const normalized = normalizeRelativePath(item);
                if (!normalized) {
                  return;
                }
                const relativePath = /\.html$/i.test(normalized) ? normalized : `${normalized}/index.html`;
                discovered.push({ root, relativePath });
              });
              // Only return from manifest, don't continue to other discovery methods
              const unique = [];
              const seen = new Set();
              discovered.forEach((entry) => {
                const key = `${entry.root}/${entry.relativePath}`;
                if (seen.has(key)) {
                  return;
                }
                seen.add(key);
                unique.push(entry);
              });
              return unique;
            }
          }
        } catch (error) {
          // Ignore manifest errors and continue with other discovery methods.
        }

        // Probe for template-N pattern folders first (most reliable for auto-discovery)
        const patternedFolders = await probePatternedTemplateFolders(root);
        if (patternedFolders.length) {
          discovered.push(...patternedFolders);
          // If we found patterned folders, return them without other methods
          const unique = [];
          const seen = new Set();
          discovered.forEach((entry) => {
            const key = `${entry.root}/${entry.relativePath}`;
            if (seen.has(key)) {
              return;
            }
            seen.add(key);
            unique.push(entry);
          });
          return unique;
        }

        const listingItems = await discoverFromDirectoryListing(root);
        if (listingItems.length) {
          discovered.push(...listingItems);
        }

        const probedFiles = await probeFlatTemplateFiles(root);
        if (probedFiles.length) {
          discovered.push(...probedFiles);
        }
      }

      const unique = [];
      const seen = new Set();
      discovered.forEach((entry) => {
        const key = `${entry.root}/${entry.relativePath}`;
        if (seen.has(key)) {
          return;
        }
        seen.add(key);
        unique.push(entry);
      });

      return unique;
    }

    // Fetch all discovered templates and prepare metadata per card.
    async function loadTemplates() {
      const files = await discoverTemplateFiles();

      if (!files.length) {
        templatesListElement.innerHTML = '<div class="template-error" style="margin-left:0">No templates found in /templates or /Templates.</div>';
        return;
      }

      const loadedTemplates = await Promise.all(files.map(async (fileEntry) => {
        const htmlPath = `${fileEntry.root}/${fileEntry.relativePath}`;
        const previewPath = await resolvePreviewPath(fileEntry.root, fileEntry.relativePath);
        const prettyName = fileEntry.relativePath
          .replace(/\/index\.html$/i, '')
          .replace('.html', '')
          .replace(/[-_]/g, ' ')
          .replace(/\//g, ' ')
          .replace(/\b\w/g, (character) => character.toUpperCase());

        try {
          const response = await fetch(htmlPath);
          if (!response.ok) {
            throw new Error(`Failed to load ${htmlPath}`);
          }
          const htmlContent = await response.text();

          return {
            file: fileEntry.relativePath,
            htmlPath,
            previewPath,
            displayName: prettyName,
            htmlContent,
            fetchError: ''
          };
        } catch (error) {
          return {
            file: fileEntry.relativePath,
            htmlPath,
            previewPath,
            displayName: prettyName,
            htmlContent: '',
            fetchError: 'Failed to load this template file.'
          };
        }
      }));

      templateEntries = loadedTemplates;
      renderTemplateCards();
    }

    // Render one card for each template with preview, name, and view action.
    function renderTemplateCards() {
      templatesListElement.innerHTML = templateEntries.map((template, index) => {
        const isSelected = selectedTemplatePath === template.htmlPath;
        const cleanName = template.displayName.replace(/^Template[\s-]*\d*\s*/i, '').trim();
        const cardTitle = cleanName ? `Template ${index + 1} ${cleanName}` : `Template ${index + 1}`;
        return `
          <article class="template-card ${isSelected ? 'selected' : ''}" data-template-path="${template.htmlPath}" ${template.fetchError ? 'aria-disabled="true"' : ''}>
            <img class="template-thumb" src="${template.previewPath}" alt="${template.displayName} preview" onerror="this.style.opacity='0.4'" />
            <h3 class="template-name">${cardTitle}</h3>
            <button class="view-btn" type="button" data-view-path="${template.htmlPath}" ${template.fetchError ? 'disabled' : ''}>👁️ View</button>
            ${template.fetchError ? `<div class="template-error">${template.fetchError}</div>` : ''}
          </article>
        `;
      }).join('');
    }

    // Attach all interaction handlers for cards, modal, and form state updates.
    function wireEvents() {

      templatesListElement.addEventListener('click', (event) => {
        const viewButton = event.target.closest('.view-btn');
        const card = event.target.closest('.template-card');

        if (viewButton) {
          event.stopPropagation();
          const path = viewButton.getAttribute('data-view-path');
          const entry = templateEntries.find((template) => template.htmlPath === path);
          if (entry && entry.htmlPath) {
            openPreviewModal(entry);
          }
          return;
        }

        if (!card) {
          return;
        }

        const path = card.getAttribute('data-template-path');
        const selected = templateEntries.find((template) => template.htmlPath === path);
        if (!selected || selected.fetchError) {
          return;
        }

        selectedTemplatePath = path;
        templateSelectionErrorElement.textContent = '';
        renderTemplateCards();
      });

      formElement.addEventListener('input', (event) => {
        const target = event.target;
        if (target && target.matches('.question-textarea')) {
          clearFieldError(target.id);
        }
      });

      closeModalButton.addEventListener('click', closePreviewModal);
      modalElement.addEventListener('click', (event) => {
        if (event.target === modalElement) {
          closePreviewModal();
        }
      });

      makePromptButton.addEventListener('click', handleMakePrompt);
    }

    // Show fullscreen preview modal with selected template inside iframe with src.
    function openPreviewModal(templateEntry) {
      modalTitleElement.textContent = `${templateEntry.displayName} Preview`;
      previewIframeElement.src = templateEntry.htmlPath;
      modalElement.classList.add('open');
    }

    // Close preview modal and release iframe document.
    function closePreviewModal() {
      modalElement.classList.remove('open');
      previewIframeElement.src = '';
    }

    // Show inline field-level validation error for a question textarea.
    function setFieldError(fieldId, message) {
      const field = document.getElementById(fieldId);
      const error = document.getElementById(`${fieldId}-error`);
      if (field) {
        field.classList.add('error');
      }
      if (error) {
        error.textContent = message;
      }
    }

    // Clear inline field-level validation error for a question textarea.
    function clearFieldError(fieldId) {
      const field = document.getElementById(fieldId);
      const error = document.getElementById(`${fieldId}-error`);
      if (field) {
        field.classList.remove('error');
      }
      if (error) {
        error.textContent = '';
      }
    }

    // Validate all required fields and selected template before packaging.
    function validateInputs() {
      let valid = true;

      QUESTIONS.forEach((question) => {
        const value = (document.getElementById(question.id)?.value || '').trim();
        if (!value) {
          setFieldError(question.id, 'This field is required.');
          valid = false;
        }
      });

      if (!selectedTemplatePath) {
        templateSelectionErrorElement.textContent = 'Please select one template.';
        valid = false;
      } else {
        templateSelectionErrorElement.textContent = '';
      }

      return valid;
    }

    // Build portfolio_spec.txt content from form answers using required outline.
    function buildPortfolioSpec(answers) {
      return `[PORTFOLIO SPECIFICATION]\nName: ${answers.q1}\nSchool & Grade: ${answers.q2}\nCore Interests: ${answers.q3}\nFeatured Project: ${answers.q4}\nSkills: ${answers.q5}\nGoals: ${answers.q6}\nTone: ${answers.q7}\nFun Fact: ${answers.q8}`;
    }

    // Build prompt.txt content from form answers using required exact structure.
    function buildPromptFile(answers) {
      return `You are a professional web developer. Your task is to customize a pre-built HTML portfolio template with a student's personal information.

        ## Context
        You will receive two inputs:
        1. A template folder (index.html, CSS, JS, images, assets)
        2. A specification file (portfolio_spec.txt) containing the student's details

        ## Primary Objective
        Produce ONE complete, ready-to-deploy index.html that looks like a polished personal portfolio — not a placeholder demo.

        ---

        ## Strict Rules

        ### What you MUST do:
        - Use index.html from the template as your exact structural and visual base
        - Replace every placeholder text (e.g. "Your Name", "Lorem ipsum", "Project Title") with real content drawn from portfolio_spec.txt and My Details below
        - Map content logically: hero section → name + tagline, about section → interests + goals, projects section → project details, skills section → skills list
        - Write all replacement text in a tone that matches the student's specified tone (see My Details: Tone)
        - Preserve ALL existing class names, IDs, and HTML structure exactly
        - Keep all <link>, <script>, and <img src> paths unchanged
        - For any image placeholder (e.g. profile photo), keep the existing src path but update the alt attribute with a descriptive, accurate label
        - If the template has a section with no matching student content, write a brief, honest placeholder rather than deleting the section

        ### What you MUST NOT do:
        - Do not modify any .css, .js, or asset files — only index.html
        - Do not add new <section> or <div> blocks unless the template already has an empty slot for them
        - Do not change any inline styles, animations, or layout structure
        - Do not include fictional or invented information not present in portfolio_spec.txt or My Details
        - Do not return markdown, code fences, explanations, or commentary — return raw HTML only

        ---

        ## Output Format
        Return ONLY the complete, modified index.html file.
        - First line must be: <!DOCTYPE html>
        - No markdown code blocks (no \`\`\`html)
        - No explanatory text before or after the file
        - No comments added by you (preserve only original template comments)

        ---

        ## Content Quality Standards
        - All text must be grammatically correct and professionally written
        - Avoid generic filler phrases like "passionate about technology" unless the student explicitly used them
        - Project descriptions must include: what it is, what problem it solves, and what technologies or skills were used
        - Skills must be listed specifically (e.g. "Python (pandas, matplotlib)" not just "Python")

        ---

        ## My Details:
        Name: ${answers.q1}
        School & Grade: ${answers.q2}
        Interests: ${answers.q3}
        Project: ${answers.q4}
        Skills: ${answers.q5}
        Goals: ${answers.q6}
        Tone: ${answers.q7}
        Fun Fact: ${answers.q8}`;
        }

    // Build and download portfolio_package.zip with template folder
    async function buildAndDownloadZip(portfolioSpec, promptFile, selectedTemplatePath) {
      if (!window.JSZip) {
        throw new Error('JSZip failed to load. Please refresh and try again.');
      }

      const zip = new JSZip();
      const folder = zip.folder('portfolio_package');

      if (!folder) {
        throw new Error('Failed to initialize ZIP folder structure.');
      }

      // Add portfolio spec and prompt
      folder.file('portfolio_spec.txt', portfolioSpec);
      folder.file('prompt.txt', promptFile);

      // Extract template folder path (e.g., "./Templates/template-1")
      const templateRoot = selectedTemplatePath.substring(0, selectedTemplatePath.lastIndexOf('/'));
      const templateFolderName = templateRoot.split('/').filter(Boolean).pop() || 'template';

      // Load files list from manifest.json
      let filesList = [];
      try {
        const manifestResponse = await fetch(`${templateRoot}/manifest.json`);
        if (manifestResponse.ok) {
          const manifestData = await manifestResponse.json();
          filesList = manifestData.files || [];
        }
      } catch (error) {
        // Ignore manifest errors and continue with fallback discovery.
      }

      // Fallback: recursively collect files from template directory listing.
      if (!filesList.length) {
        filesList = await collectFilesFromDirectory(templateRoot);
      }

      // Ensure the selected template entry file is included.
      const selectedEntryName = selectedTemplatePath.split('/').filter(Boolean).pop();
      if (selectedEntryName && !filesList.includes(selectedEntryName)) {
        filesList.unshift(selectedEntryName);
      }

      if (!filesList.length) {
        ctaErrorElement.textContent = 'Could not load template files. Please run with a local server and try again.';
        throw new Error('No template files were discovered for the selected template.');
      }

      // Add all files to ZIP
      const templateFolder = folder.folder(templateFolderName);
      if (!templateFolder) {
        throw new Error('Failed to create selected template folder in ZIP.');
      }

      for (const filePath of filesList) {
        try {
          const fullPath = `${templateRoot}/${filePath}`;
          const response = await fetch(fullPath);

          if (response.ok) {
            const blob = await response.blob();
            templateFolder.file(filePath, blob);
          }
        } catch (error) {
          console.warn(`Could not load ${filePath}:`, error);
        }
      }

      const blob = await zip.generateAsync({ type: 'blob' });
      const downloadUrl = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = downloadUrl;
      anchor.download = 'portfolio_package.zip';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(downloadUrl);
    }

    // Main CTA flow: validate, generate in-memory files, zip package, and download.
    async function handleMakePrompt() {
      ctaErrorElement.textContent = '';

      if (!validateInputs()) {
        ctaErrorElement.textContent = 'Please resolve the highlighted errors above.';
        return;
      }

      const answers = {};
      QUESTIONS.forEach((question) => {
        answers[question.id] = (document.getElementById(question.id)?.value || '').trim();
      });

      const selectedTemplate = templateEntries.find((entry) => entry.htmlPath === selectedTemplatePath);
      if (!selectedTemplate || !selectedTemplatePath) {
        ctaErrorElement.textContent = 'Selected template could not be loaded. Choose another template.';
        return;
      }

      const portfolioSpec = buildPortfolioSpec(answers);
      const promptFile = buildPromptFile(answers);

      try {
        await buildAndDownloadZip(portfolioSpec, promptFile, selectedTemplatePath);
      } catch (error) {
        ctaErrorElement.textContent = 'ZIP generation failed. Please try again.';
        console.error('ZIP generation error:', error);
      }
    }

    // Initialize app: render form, load templates, and bind events.
    async function init() {
      renderQuestions();
      wireEvents();
      await loadTemplates();
    }

    init();
  </script>
</body>
